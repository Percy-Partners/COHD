    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:clamp(1.25rem,3.5vh,2.25rem);
    padding:clamp(1.75rem,5vh,3.5rem) 1.25rem clamp(1.25rem,3vh,2rem);
    position:relative;
    overflow-x:hidden;
    color:var(--ink);
    background:
      radial-gradient(58vw 58vw at 10% -10%, #F8DEDA 0%, rgba(248,222,218,0) 62%),
      radial-gradient(52vw 52vw at 96% 4%, #E6EBDC 0%, rgba(230,235,220,0) 64%),
      radial-gradient(80vw 52vw at 50% 112%, #F6E3C6 0%, rgba(246,227,198,0) 66%),
      var(--paper);
    background-attachment:fixed;
  }

  /* soft paper grain */
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    opacity:.07;
    mix-blend-mode:multiply;
    background-image:url("data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20width='160'%20height='160'%3E%3Cfilter%20id='n'%3E%3CfeTurbulence%20type='fractalNoise'%20baseFrequency='.85'%20numOctaves='3'%20stitchTiles='stitch'/%3E%3C/filter%3E%3Crect%20width='160'%20height='160'%20filter='url(%23n)'%20opacity='.5'/%3E%3C/svg%3E");
  }

  .stage{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    max-width:40rem;
  }

  /* ---------- mascot ---------- */
  .mascot{
    position:relative;
    width:clamp(176px, 23vw, 272px);
    border-radius:50%;
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) both;
  }
  .mascot svg{
    display:block;
    width:100%;
    height:auto;
    animation:bob 7s ease-in-out 1.2s infinite;
  }

  /* ---------- eyebrow ---------- */
  .eyebrow{
    display:flex;
    align-items:center;
    gap:clamp(.6rem,2.5vw,1.1rem);
    margin:clamp(1.35rem,3.5vh,1.9rem) 0 0;
    font-family:var(--sans);
    font-weight:400;
    font-size:clamp(.58rem,2.1vw,.68rem);
    letter-spacing:.42em;
    text-transform:uppercase;
    color:var(--ink-soft);
    text-indent:.42em;
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .12s both;
  }
  .eyebrow span{
    display:block;
    width:clamp(26px,9vw,58px);
    height:1px;
    background:linear-gradient(90deg, rgba(192,128,138,0), var(--rose));
  }
  .eyebrow span:last-child{
    background:linear-gradient(270deg, rgba(192,128,138,0), var(--rose));
  }

  /* ---------- wordmark ---------- */
  .wordmark{
    margin:.55rem 0 0;
    font-family:var(--serif);
    font-weight:300;
    font-size:clamp(2.85rem,9.5vw,6.1rem);
    line-height:.98;
    letter-spacing:.004em;
    color:var(--ink);
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .22s both;
  }
  .wordmark em{
    font-style:italic;
    font-weight:300;
    font-size:.86em;
    color:var(--rose-deep);
    padding:0 .04em;
  }

  .sub{
    margin:.7rem 0 0;
    font-family:var(--sans);
    font-weight:400;
    font-size:clamp(.68rem,2.4vw,.8rem);
    letter-spacing:.62em;
    text-indent:.62em;
    text-transform:uppercase;
    color:var(--sage);
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .3s both;
  }

  /* ---------- divider ---------- */
  .divider{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:.85rem;
    width:min(16rem,72vw);
    margin:clamp(1.2rem,3.2vh,1.7rem) 0 0;
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .36s both;
  }
  .divider i{
    flex:1;
    height:1px;
    background:linear-gradient(90deg, rgba(159,175,146,0), rgba(159,175,146,.85), rgba(159,175,146,0));
  }
  .divider svg{width:11px;height:11px;flex:none;color:var(--gold)}

  /* ---------- copy ---------- */
  .lede{
    margin:clamp(1.1rem,3vh,1.6rem) 0 0;
    font-family:var(--serif);
    font-style:italic;
    font-weight:400;
    font-size:clamp(1.28rem,4.6vw,1.72rem);
    line-height:1.42;
    color:var(--ink);
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .44s both;
  }
  .lede b{
    font-weight:400;
    color:var(--rose-deep);
    white-space:nowrap;
  }

  .note{
    margin:clamp(.9rem,2.4vh,1.25rem) auto 0;
    max-width:31ch;
    font-family:var(--sans);
    font-weight:300;
    font-size:clamp(.9rem,2.9vw,1.02rem);
    line-height:1.9;
    letter-spacing:.015em;
    color:var(--ink-soft);
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .52s both;
  }

  .sign{
    display:inline-flex;
    align-items:center;
    gap:.5rem;
    margin:clamp(1.15rem,3vh,1.6rem) 0 0;
    font-family:var(--sans);
    font-size:clamp(.6rem,2.1vw,.68rem);
    letter-spacing:.3em;
    text-indent:.3em;
    text-transform:uppercase;
    color:#8A7361;
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .6s both;
  }
  .sign svg{width:13px;height:13px;flex:none;color:var(--rose-deep);text-indent:0}

  /* ---------- footer ---------- */
  footer{
    position:relative;
    z-index:1;
    font-family:var(--sans);
    font-weight:300;
    font-size:clamp(.58rem,2vw,.66rem);
    letter-spacing:.26em;
    text-transform:uppercase;
    color:#97826F;
    text-align:center;
    animation:rise 1.1s cubic-bezier(.2,.7,.3,1) .68s both;
  }

  /* ---------- floating sparkles ---------- */
  .sparkle{
    position:fixed;
    z-index:0;
    pointer-events:none;
    color:var(--gold);
    opacity:.5;
    animation:twinkle 6s ease-in-out infinite;
  }
  .sparkle.a{top:14%;left:8%;width:20px;height:20px}
  .sparkle.b{top:24%;right:11%;width:14px;height:14px;color:var(--sage);animation-delay:1.4s}
  .sparkle.c{bottom:16%;left:16%;width:12px;height:12px;color:var(--rose);animation-delay:2.6s}
  .sparkle.d{bottom:22%;right:15%;width:17px;height:17px;animation-delay:3.5s}

  @keyframes rise{
    from{opacity:0;transform:translateY(14px)}
    to{opacity:1;transform:translateY(0)}
  }
  @keyframes bob{
    0%,100%{transform:translateY(0) rotate(-.5deg)}
    50%{transform:translateY(-7px) rotate(.7deg)}
  }
  @keyframes twinkle{
    0%,100%{opacity:.18;transform:scale(.86)}
    50%{opacity:.6;transform:scale(1)}
  }

  @media (max-width:420px){
    .sparkle.a{left:5%}
    .sparkle.b{right:6%}
    .sparkle.d{right:7%}
  }

  @media (prefers-reduced-motion: reduce){
    *,*::before,*::after{
      animation:none !important;
      transition:none !important;
      opacity:1 !important;
      transform:none !important;
    }
  }
</style>
</head>
